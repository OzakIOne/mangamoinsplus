name: Release

on:
  push:
    tags:
      - "v*" # déclenché uniquement sur les tags v1.2.3, v0.4, etc.

permissions:
  contents: write # nécessaire pour créer la release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run compile

      - name: Build extension
        run: bun run build

      - name: Zip extension
        run: |
          cd build/mangamoinsplus-chrome-mv3
          zip -r ../../mangamoinsplus-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mangamoinsplus-${{ github.ref_name }}.zip
